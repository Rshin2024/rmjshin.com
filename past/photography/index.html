  <script>
    // Progressive enhancement: without JS the track still scrolls and swipes.
    document.querySelectorAll('.viewer').forEach(function (v) {
      var track = v.querySelector('.track');
      var slides = track.children;
      var prev = v.querySelector('.prev'), next = v.querySelector('.next');
      var out = v.querySelector('.i');
      v.querySelector('.n').textContent = slides.length;

      var target = null, settle;
      function index() { return target !== null ? target : Math.round(track.scrollLeft / track.clientWidth); }
      function go(i) {
        target = (i + slides.length) % slides.length;
        out.textContent = target + 1;
        track.scrollTo({ left: target * track.clientWidth, behavior: 'smooth' });
      }
      function update() {
        if (target === null) out.textContent = Math.round(track.scrollLeft / track.clientWidth) + 1;
      }

      prev.addEventListener('click', function () { go(index() - 1); });
      next.addEventListener('click', function () { go(index() + 1); });
      track.addEventListener('scroll', function () {
        window.requestAnimationFrame(update);
        clearTimeout(settle);
        settle = setTimeout(function () { target = null; update(); }, 150);
      }, { passive: true });
      track.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(index() - 1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); go(index() + 1); }
      });
      // Click the left or right half of the photo to step through.
      track.addEventListener('click', function (e) {
        var r = track.getBoundingClientRect();
        go(index() + (e.clientX - r.left < r.width / 2 ? -1 : 1));
      });
      // Keep the current photo centred if the window is resized.
      window.addEventListener('resize', function () {
        track.scrollTo({ left: (Number(out.textContent) - 1) * track.clientWidth });
      });
      v.classList.add('js');
    });
  </script>
